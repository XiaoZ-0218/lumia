[package]
name = "lumia"
version = "0.2.0"
description = "Lumia — a Typora-like desktop markdown editor built with Tauri v2"
edition = "2021"
rust-version = "1.90"

# The lib target is required by Tauri v2 (staticlib/cdylib for mobile, rlib for desktop).
# src/main.rs is auto-detected as the binary, so the packaged binary is "lumia".
[lib]
name = "lumia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSOpenPanel", "NSSavePanel", "NSPanel", "NSResponder", "NSWindow", "NSApplication"] }

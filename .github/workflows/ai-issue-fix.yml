name: AI Issue Fix

# Triggers when an issue gets the `ai-fix` label. Kimi Code CLI reads the issue,
# fixes the bug on a branch, runs the build + smoke test, opens a PR, and
# enables auto-merge so the PR lands once CI is green.
#
# Required secret: KIMI_API_KEY (Moonshot API key, https://platform.moonshot.ai)

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.label.name == 'ai-fix'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      # Headless auth for Kimi Code CLI (KIMI_MODEL_* synthesizes a provider in memory).
      KIMI_MODEL_NAME: kimi-for-coding
      KIMI_MODEL_API_KEY: ${{ secrets.KIMI_API_KEY }}
      KIMI_MODEL_BASE_URL: https://api.moonshot.ai/v1
      KIMI_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Kimi Code CLI
        run: npm install -g @moonshot-ai/kimi-code

      - name: Create fix branch
        run: |
          BRANCH="ai-fix/issue-${ISSUE_NUMBER}"
          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"
          git checkout -b "${BRANCH}"

      - name: Run Kimi Code to fix the issue
        run: |
          cat > /tmp/prompt.txt <<PROMPT
          You are fixing a GitHub issue in this repository (a Typora-like markdown
          editor: Vite + TypeScript frontend in src/, Milkdown/ProseMirror based).

          Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}

          ${ISSUE_BODY}

          Instructions:
          1. Investigate the codebase and find the root cause.
          2. Make a MINIMAL fix. Do not refactor unrelated code.
          3. If scripts/smoke.mjs covers the affected behavior, update it so the
             regression is asserted there.
          4. Verify with: npm i --no-save jsdom && npm run build && node scripts/smoke.mjs
             Keep iterating until the build and smoke test pass.
          5. Do NOT run any git commands (no commit/push/branch) — the CI
             pipeline handles git. Just leave the fixed files in the worktree.
          PROMPT
          kimi -p "$(cat /tmp/prompt.txt)"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment when nothing changed
        if: steps.changes.outputs.has_changes == 'false'
        run: |
          gh issue comment "${ISSUE_NUMBER}" \
            --body "🤖 AI fix attempt made no changes — the agent could not produce a fix automatically. Please investigate manually."

      - name: Commit, push, open PR with auto-merge
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: ${ISSUE_TITLE} (#${ISSUE_NUMBER})

          Automated fix by Kimi Code CLI.

          Closes #${ISSUE_NUMBER}"
          git push -u origin "${BRANCH}"
          PR_URL=$(gh pr create \
            --title "fix: ${ISSUE_TITLE} (#${ISSUE_NUMBER})" \
            --body "Automated fix for #${ISSUE_NUMBER}, generated by Kimi Code CLI.

          Closes #${ISSUE_NUMBER}" \
            --base main --head "${BRANCH}")
          gh pr merge "${PR_URL}" --auto --squash
          gh issue comment "${ISSUE_NUMBER}" \
            --body "🤖 Opened ${PR_URL} with an automated fix. It will merge automatically once CI passes."

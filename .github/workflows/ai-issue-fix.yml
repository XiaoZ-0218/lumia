name: AI Issue Fix

# Triggers when the repo owner labels an issue:
#   ai-fix:kimi     -> fix with Kimi (k3-256k, secret KIMI_API_KEY)
#   ai-fix:deepseek -> fix with DeepSeek (deepseek-v4-flash, secret DEEPSEEK_API_KEY)
#
# Kimi Code CLI reads the issue, fixes the bug on a branch, runs the build +
# smoke test, opens a PR, waits for its CI to go green, and merges it.
# Progress is reported back as issue comments (started / failed / PR merged).

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    # Only run when the repo owner applies an ai-fix:* label — labels from
    # anyone else are ignored.
    if: startsWith(github.event.label.name, 'ai-fix:') && github.event.sender.login == 'XiaoZ-0218'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Headless auth for Kimi Code CLI (KIMI_MODEL_* synthesizes a provider in
      # memory). Model is selected by which label was applied.
      # Kimi: k3-256k via the Kimi Code API — needs a Kimi Code Console API key
      # (https://www.kimi.com/code console) in secret KIMI_API_KEY.
      KIMI_MODEL_NAME: ${{ github.event.label.name == 'ai-fix:deepseek' && 'deepseek-v4-flash' || 'k3-256k' }}
      KIMI_MODEL_PROVIDER_TYPE: ${{ github.event.label.name == 'ai-fix:deepseek' && 'openai' || 'kimi' }}
      KIMI_MODEL_API_KEY: ${{ github.event.label.name == 'ai-fix:deepseek' && secrets.DEEPSEEK_API_KEY || secrets.KIMI_API_KEY }}
      KIMI_MODEL_BASE_URL: ${{ github.event.label.name == 'ai-fix:deepseek' && 'https://api.deepseek.com/v1' || 'https://api.kimi.com/coding/v1' }}
      KIMI_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Comment that the run started
        run: |
          gh issue comment "${ISSUE_NUMBER}" \
            --body "🤖 开始自动修复，使用模型 \`${KIMI_MODEL_NAME}\`。[查看运行日志](${RUN_URL})"

      - name: Check API key is configured
        run: |
          if [ -z "${KIMI_MODEL_API_KEY}" ]; then
            gh issue comment "${ISSUE_NUMBER}" \
              --body "⚠️ 缺少 API key secret（模型 \`${KIMI_MODEL_NAME}\`）。请在仓库 Settings → Secrets 中配置后重新打标签。"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Kimi Code CLI
        run: npm install -g @moonshot-ai/kimi-code

      - name: Create fix branch
        run: |
          BRANCH="ai-fix/issue-${ISSUE_NUMBER}"
          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"
          git checkout -b "${BRANCH}"

      - name: Run Kimi Code to fix the issue
        run: |
          cat > /tmp/prompt.txt <<PROMPT
          You are fixing a GitHub issue in this repository (Lumia, a Typora-like
          markdown editor: Vite + TypeScript frontend in src/, Milkdown/ProseMirror based).

          Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}

          ${ISSUE_BODY}

          Instructions:
          1. Investigate the codebase and find the root cause.
          2. Make a MINIMAL fix. Do not refactor unrelated code.
          3. If scripts/smoke.mjs covers the affected behavior, update it so the
             regression is asserted there.
          4. Verify with: npm i --no-save jsdom && npm run build && node scripts/smoke.mjs
             Keep iterating until the build and smoke test pass.
          5. Do NOT run any git commands (no commit/push/branch) — the CI
             pipeline handles git. Just leave the fixed files in the worktree.
          PROMPT
          kimi -p "$(cat /tmp/prompt.txt)"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment when nothing changed
        if: steps.changes.outputs.has_changes == 'false'
        run: |
          gh issue comment "${ISSUE_NUMBER}" \
            --body "🤖 AI fix attempt made no changes — the agent could not produce a fix automatically. Please investigate manually."

      - name: Commit, push, open PR, wait for CI, merge
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: ${ISSUE_TITLE} (#${ISSUE_NUMBER})

          Automated fix by Kimi Code CLI (${KIMI_MODEL_NAME}).

          Closes #${ISSUE_NUMBER}"
          git push -u origin "${BRANCH}"
          PR_URL=$(gh pr create \
            --title "fix: ${ISSUE_TITLE} (#${ISSUE_NUMBER})" \
            --body "Automated fix for #${ISSUE_NUMBER}, generated by Kimi Code CLI (\`${KIMI_MODEL_NAME}\`).

          Closes #${ISSUE_NUMBER}" \
            --base main --head "${BRANCH}")
          gh issue comment "${ISSUE_NUMBER}" \
            --body "🔀 已提交修复 PR：${PR_URL}（模型 \`${KIMI_MODEL_NAME}\`），等待 CI 通过后自动合并。"
          # Auto-merge is unavailable on private repos without a paid plan, so
          # wait for the PR checks here and merge directly.
          if gh pr checks "${PR_URL}" --watch --interval 30; then
            gh pr merge "${PR_URL}" --squash --delete-branch
            gh issue comment "${ISSUE_NUMBER}" \
              --body "✅ CI 通过，${PR_URL} 已自动合并。"
          else
            gh issue comment "${ISSUE_NUMBER}" \
              --body "❌ PR 的 CI 未通过：${PR_URL}，请人工检查。"
            exit 1
          fi

      - name: Comment on failure
        if: failure()
        run: |
          gh issue comment "${ISSUE_NUMBER}" \
            --body "❌ 自动修复失败（模型 \`${KIMI_MODEL_NAME}\`）。[查看运行日志](${RUN_URL})"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumia</title>
  </head>
  <body class="theme-github">
    <!-- data-tauri-drag-region="deep": the desktop shell uses an overlay
         titlebar, so this custom bar is the only draggable area. "deep" lets
         clicks on the title strip drag the window; Tauri's drag script skips
         buttons/selects inside, so they stay clickable. Inert in browsers. -->
    <header class="titlebar" data-tauri-drag-region="deep">
      <div class="traffic-lights" aria-hidden="true">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <button class="titlebar-btn titlebar-btn-icon" id="sidebar-toggle" data-i18n-title="toggleSidebar" data-i18n-aria-label="toggleSidebar" title="Toggle sidebar" aria-label="Toggle sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"></rect>
          <line x1="6.25" y1="2.75" x2="6.25" y2="13.25"></line>
        </svg>
      </button>
      <span class="doc-title" id="doc-title">Untitled</span>
      <div class="titlebar-right">
        <div class="titlebar-menu-wrap">
          <button class="titlebar-btn" id="open-menu" data-i18n="open" data-i18n-title="openPlain" data-i18n-aria-label="openPlain" title="Open" aria-label="Open" aria-haspopup="true" aria-expanded="false">Open ▾</button>
          <div class="titlebar-dropdown" id="open-dropdown" hidden>
            <button class="titlebar-dropdown-item" id="open-file" data-i18n="openFile" data-i18n-title="openFileTitle" data-i18n-aria-label="openFile" title="Open file (⌘O)" aria-label="Open file">Open file</button>
            <button class="titlebar-dropdown-item" id="open-folder" data-i18n="openFolder" data-i18n-title="openFolder" data-i18n-aria-label="openFolder" title="Open folder" aria-label="Open folder">Open folder</button>
          </div>
        </div>
        <button class="titlebar-btn" id="save-file" data-i18n="save" data-i18n-title="saveTitle" data-i18n-aria-label="saveFile" title="Save file (⌘S)" aria-label="Save file">Save</button>
        <div class="titlebar-menu-wrap">
          <button class="titlebar-btn" id="export-menu" data-i18n="export" data-i18n-title="exportPlain" data-i18n-aria-label="exportPlain" title="Export" aria-label="Export" aria-haspopup="true" aria-expanded="false">Export ▾</button>
          <div class="titlebar-dropdown" id="export-dropdown" hidden>
            <button class="titlebar-dropdown-item" id="export-html" data-i18n-title="exportHtmlTitle" data-i18n-aria-label="exportHtmlTitle" title="Export as HTML" aria-label="Export as HTML">HTML</button>
            <button class="titlebar-dropdown-item" id="export-pdf" data-i18n-title="exportPdfTitle" data-i18n-aria-label="exportPdfTitle" title="Print / export PDF (⌘P)" aria-label="Export as PDF">PDF</button>
          </div>
        </div>
      </div>
    </header>

    <aside class="sidebar">
      <section class="sidebar-section">
        <h2 data-i18n="files">Files</h2>
        <div class="files-header" id="files-header">
          <button class="up-dir" id="up-dir" data-i18n-title="openParent" data-i18n-aria-label="openParent" title="Open parent folder" aria-label="Open parent folder">..</button>
          <span class="root-name" id="root-name" data-i18n="noFolder">No folder</span>
        </div>
        <ul id="file-tree">
          <li>welcome.md</li>
          <li>README.md</li>
          <li>notes/ideas.md</li>
        </ul>
      </section>
      <section class="sidebar-section">
        <h2 data-i18n="outline">Outline</h2>
        <ul id="outline">
          <li>Welcome to Lumia</li>
          <li>Write inline styles</li>
          <li>Lists</li>
          <li>Task lists</li>
          <li>Blockquote</li>
          <li>Code</li>
          <li>Table</li>
        </ul>
      </section>
    </aside>

    <main id="editor">
      <textarea id="source" spellcheck="false" data-i18n-placeholder="sourcePlaceholder" placeholder="Source mode — edit the markdown directly"></textarea>
    </main>

    <footer class="statusbar">
      <span id="word-count">0 words · 0 chars</span>
      <div class="statusbar-right">
        <button class="statusbar-btn" id="focus-toggle" data-i18n="focus" data-i18n-title="focusTitle" title="Toggle focus mode (F8)">Focus</button>
        <button class="statusbar-btn" id="typewriter-toggle" data-i18n="typewriter" data-i18n-title="typewriterTitle" title="Toggle typewriter mode">Typewriter</button>
        <label class="statusbar-label" for="theme-select" data-i18n="theme">Theme</label>
        <select id="theme-select" data-i18n-title="theme" data-i18n-aria-label="theme" title="Theme" aria-label="Theme"></select>
        <label class="statusbar-label" for="lang-select" data-i18n="lang">Lang</label>
        <select id="lang-select" data-i18n-title="langTitle" data-i18n-aria-label="langTitle" title="Language" aria-label="Language">
          <option value="en">English</option>
          <option value="zh">简体中文</option>
          <option value="ja">日本語</option>
        </select>
        <button class="statusbar-btn" id="zoom-out" data-i18n-title="zoomOutTitle" data-i18n-aria-label="zoomOutTitle" title="Zoom out (⌘-)" aria-label="Zoom out">−</button>
        <button class="statusbar-btn" id="zoom-in" data-i18n-title="zoomInTitle" data-i18n-aria-label="zoomInTitle" title="Zoom in (⌘+)" aria-label="Zoom in">+</button>
        <button class="statusbar-btn" id="source-toggle" data-i18n="source" data-i18n-title="sourceTitle" title="Toggle source mode (⌘/)">Source</button>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
